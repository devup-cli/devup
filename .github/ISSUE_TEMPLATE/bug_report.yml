name: Bug Report
description: Report a bug or unexpected behavior in devup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, manifest files, or devup.toml snippet.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostic output
      description: Paste output from `devup doctor --json` (sensitive values are redacted automatically).
      render: json
  - type: input
    id: os
    attributes:
      label: OS & Python version
      placeholder: "e.g. Windows 11 / Ubuntu 24.04 / macOS 15, Python 3.12"
