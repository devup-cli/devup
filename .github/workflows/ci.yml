name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -W error -m unittest discover -s tests -v

      - name: Enforce Python test coverage threshold
        if: matrix.python-version == '3.12' && matrix.os != 'macos-latest'
        run: python -W error scripts/check_coverage.py --min-coverage 65

      - name: Install package
        run: python -m pip install .

      - name: Smoke-test devup CLI
        run: devup --version

      - name: Verify devup help output
        run: devup --help

      - name: Smoke-test installed CLI and zipapp on sample project
        shell: python
        run: |
          import json, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              p = Path(tmp)
              (p / "package.json").write_text(json.dumps({"scripts": {"test": "echo ok"}}))
              out = subprocess.check_output(["devup", "-C", tmp, "list", "--json"], text=True)
              assert "test" in json.loads(out)["tasks"]
              subprocess.check_call(["devup", "-C", tmp, "--dry-run", "test"])
              pyz = p / "devup.pyz"
              subprocess.check_call([sys.executable, "scripts/build_zipapp.py", "--output", str(pyz)])
              ver = subprocess.check_output([sys.executable, str(pyz), "--version"], text=True).strip()
              assert ver.startswith("devup "), ver
              pyz_out = subprocess.check_output([sys.executable, str(pyz), "-C", tmp, "list", "--json"], text=True)
              assert "test" in json.loads(pyz_out)["tasks"]

  packaging-pipx-uvx:
    name: Verify pip, pipx, and uvx install (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pip, pipx, and uvx installs
        run: |
          python -m pip install --upgrade pip pipx uv
          python -m pip install .
          devup --version
          python -m pip uninstall -y devup-cli
          pipx install .
          PIPX_BIN="$(pipx environment --value PIPX_BIN_DIR)"
          "$PIPX_BIN/devup" --version
          pipx uninstall devup-cli
          uvx --from . devup --version
          uvx --from . devup doctor --json > /dev/null

  packaging-homebrew:
    name: Verify Homebrew formula install & uninstall (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, test, and uninstall Homebrew formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/devup-cli/homebrew-tap"
          mkdir -p "$TAP_DIR/Formula"
          cp packaging/homebrew/devup-cli.rb "$TAP_DIR/Formula/devup-cli.rb"
          brew install --build-from-source devup-cli/tap/devup-cli
          "$(brew --prefix)/bin/devup" --version
          brew test devup-cli/tap/devup-cli
          brew uninstall devup-cli

  packaging-scoop:
    name: Verify Scoop manifest install & uninstall (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, verify, and uninstall Scoop manifest
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-Expression "& {$(Invoke-RestMethod -Uri https://get.scoop.sh)} -RunAsAdmin"
          }
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add main
          $manifest = (Resolve-Path packaging\scoop\devup.json).Path
          scoop install $manifest
          & "$env:USERPROFILE\scoop\shims\devup.cmd" --version
          & "$env:USERPROFILE\scoop\shims\devup.cmd" doctor --json | Out-Null
          scoop uninstall devup

  npm-package:
    name: Node.js ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
        exclude:
          - os: macos-latest
            node-version: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run npm package unit tests
        working-directory: packages/npm
        if: matrix.node-version != '22'
        run: npm test
      - name: Run npm package unit tests with coverage threshold
        working-directory: packages/npm
        if: matrix.node-version == '22'
        run: node --test --experimental-test-coverage --test-coverage-lines=70
      - name: Verify npm pack and global tarball install
        shell: bash
        working-directory: packages/npm
        run: |
          node bin/devup.js --version
          TGZ="$(npm pack --silent)"
          npm install -g "./$TGZ"
          devup --version
          devup -C ../../examples/fastapi-react list --json > /dev/null
          npm uninstall -g @devup-cli/devup
