name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Build zipapp and platform bundles
        run: |
          python scripts/build_zipapp.py --output dist-zipapp/devup.pyz
          python -c "import hashlib, pathlib; p = pathlib.Path('dist-zipapp/devup.pyz'); h = hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('dist-zipapp/devup.pyz.sha256').write_text(f'{h}  devup.pyz\n')"
          python scripts/build_bundles.py --output dist-bundles --tag "${{ github.ref_name || '0.3.0' }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload zipapp and bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zipapp
          path: |
            dist-zipapp/
            dist-bundles/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/devup-cli
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

  attach-zipapp:
    name: Attach zipapp to GitHub Release
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zipapp artifact
        uses: actions/download-artifact@v4
        with:
          name: zipapp
          path: .

      - name: Upload devup.pyz, platform bundles, and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ASSETS=(dist-zipapp/devup.pyz dist-zipapp/devup.pyz.sha256 dist-bundles/*.zip dist-bundles/*.tar.gz dist-bundles/*.sha256)
          gh release upload "${{ github.ref_name }}" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber

  verify-pypi:
    name: Post-publication PyPI smoke test
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install devup-cli from PyPI and smoke test
        shell: python
        run: |
          import json, os, subprocess, sys, tempfile, time
          from pathlib import Path
          tag = os.environ.get("GITHUB_REF_NAME", "")
          spec = f"devup-cli=={tag.lstrip('v')}" if tag.startswith("v") else "devup-cli"
          with tempfile.TemporaryDirectory() as td:
              venv = Path(td) / "venv"
              subprocess.check_call([sys.executable, "-m", "venv", str(venv)])
              vpy = venv / "bin" / "python"
              vdev = venv / "bin" / "devup"
              installed = False
              for attempt in range(8):
                  rc = subprocess.call([str(vpy), "-m", "pip", "install", "--no-cache-dir", spec])
                  if rc == 0:
                      installed = True
                      break
                  time.sleep(10)
              assert installed, f"Failed to install {spec} from PyPI"
              out_ver = subprocess.check_output([str(vdev), "--version"], text=True).strip()
              print("Installed:", out_ver)
              doc = subprocess.check_output([str(vdev), "doctor", "--json"], text=True)
              assert "devup_version" in json.loads(doc)

  build-npm:
    name: Build & test npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run npm unit tests
        working-directory: packages/npm
        run: npm test
      - name: Pack tarball
        working-directory: packages/npm
        run: |
          mkdir -p ../../dist-npm
          npm pack --pack-destination ../../dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: dist-npm/

  publish-npm:
    name: Publish to npm (@devup-cli/devup)
    needs: [build-npm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@devup-cli/devup
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish package to npm
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  verify-npm:
    name: Post-publication npm smoke test
    needs: [publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install @devup-cli/devup from npm and smoke test
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          SPEC="@devup-cli/devup"
          if [[ "$TAG" == v* ]]; then
            SPEC="@devup-cli/devup@${TAG#v}"
          fi
          installed=0
          for attempt in $(seq 1 8); do
            if npm install -g "$SPEC"; then
              installed=1
              break
            fi
            sleep 10
          done
          test "$installed" -eq 1
          devup --version
          devup-node --version
          devup-node doctor --json > /dev/null
          npm uninstall -g @devup-cli/devup
