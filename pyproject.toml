[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devup"
version = "0.1.0"
description = "Polyglot project script discovery and multi-service parallel runner with colored logs and clean Ctrl+C shutdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "devup contributors" },
]
keywords = ["cli", "devtools", "process-manager", "monorepo", "polyglot", "runner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/devup-cli/devup"
Repository = "https://github.com/devup-cli/devup"
Issues = "https://github.com/devup-cli/devup/issues"

[project.scripts]
devup = "devup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
