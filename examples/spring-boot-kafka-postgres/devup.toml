default = ["dev"]
fail_fast = true

[groups]
dev = ["postgres", "kafka", "api"]

[tasks.postgres]
command = "docker compose up postgres"
port = 5432
ready_tcp = "127.0.0.1:5432"
ready_timeout = 30

[tasks.kafka]
command = "docker compose up kafka"
port = 9092
ready_tcp = "127.0.0.1:9092"
ready_timeout = 40

[tasks.api]
command = "mvn spring-boot:run"
cwd = "service"
port = 8080
depends_on = ["postgres", "kafka"]
ready_url = "http://127.0.0.1:8080/actuator/health"
ready_timeout = 45
