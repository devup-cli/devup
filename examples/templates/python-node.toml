default = ["dev"]
fail_fast = true
auto_env = true

[groups]
dev = ["api", "web"]

[tasks.api]
command = "uvicorn main:app --reload --port 8000"
cwd = "backend"
port = 8000
ready_url = "http://127.0.0.1:8000/health"

[tasks.web]
command = "npm run dev"
cwd = "frontend"
port = 5173
depends_on = ["api"]
